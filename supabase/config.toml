# Disposable local Auth validation only. No hosted project is linked.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "app-starter-e2e"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 55329

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 55323

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
admin_email = "admin@app-starter.test"
sender_name = "App Starter Local Auth"

[storage]
enabled = false

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Local public-mode tests. Invitation-only tests must also disable Auth signups.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000
token_refresh = 1000

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your App Starter account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your App Starter password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Your App Starter invitation"
content_path = "./supabase/templates/invite.html"

[edge_runtime]
enabled = false
inspector_port = 55328

[analytics]
enabled = false
port = 55327
